version: "3.8"

# 课程设计演示编排：api + web。数据库是容器内的 SQLite 文件，不需要 MySQL。
# 用法：cp backend/.env.example backend/.env  → 编辑真实密钥 → docker compose up -d
#      离线演示：backend/.env 里设 LLM_ENABLED=false，AI 全部走 MockLlmClient 模板结果（AC-66）

services:
  api:
    build: ./backend
    image: haofangzi-api:1.0.0
    container_name: hf-api
    environment:
      SQLITE_PATH: /data/haofangzi.db
      JWT_SECRET: demo-only-please-change-me-32bytes!!
      LLM_ENABLED: "true"
      LLM_BASE_URL: https://api.siliconflow.cn/v1
      LLM_MODEL: Qwen/Qwen3.5-4B
      LLM_TIMEOUT_MS: "60000"
      LLM_API_KEY: ${LLM_API_KEY:-}
    env_file:
      - ./backend/.env
    ports: ["8080:8080"]
    volumes:
      - hfdata:/data
      - hfmedia:/app/upload
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/house-types?size=1"]
      interval: 15s
      retries: 8

  web:
    build: ./frontend
    image: haofangzi-web:1.0.0
    container_name: hf-web
    depends_on: [api]
    ports: ["3000:80"]        # 与预览/校内展示口径一致；nginx 反代 /api → hf-api:8080

volumes:
  hfdata: {}
  hfmedia: {}
