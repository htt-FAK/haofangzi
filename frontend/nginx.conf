server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA 路由：history 模式回退（否则 /house-type/1 刷新 404）
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 后端反代（compose 中 api 服务名 hf-api）
  location /api/ {
    proxy_pass http://hf-api:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;      # 审计日志需要真实 IP（NFR-06）
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;                        # 大于 AI 超时 8s，避免半路断开
  }

  # 户型 3D / 全景素材
  location /upload/ {
    proxy_pass http://hf-api:8080/upload/;
    expires 10m;
    add_header Cache-Control "public";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
